name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  find-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@v4

      - id: find
        run: echo "projects=$(ls -d tests/*/*.IntegrationTests | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  # Unit and architecture tests need no database, so they run in seconds beside the integration jobs.
  build-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'dotnet-tools.json', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build Flownodes.slnx

      - name: Unit and architecture tests
        run: |
          for project in tests/Architecture.Tests tests/*/*.UnitTests; do
            dotnet test --project "$project" --no-build --output Detailed
          done

      # Wolverine's handler code is generated and committed (apps/Flownodes/Internal/Generated/README.md). Writing it
      # again must change nothing; a diff means a handler or message changed without regenerating.
      - name: Generated handler code is current
        env:
          ConnectionStrings__registry: Host=localhost;Database=ci
          ConnectionStrings__identity: Host=localhost;Database=ci
          ConnectionStrings__engine: Host=localhost;Database=ci
          Flownodes__InstallationKey: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          dotnet run --project apps/Flownodes --no-build -- codegen write
          git diff --exit-code -- apps/Flownodes/Internal/Generated
          test -z "$(git ls-files --others --exclude-standard apps/Flownodes/Internal/Generated)"

      # The integration-test hosts load their own committed handler code (tests/*/*.IntegrationTests/Internal/Generated).
      - name: Generated test handler code is current
        run: |
          scripts/generate-test-handlers.sh
          git diff --exit-code -- 'tests/*/*.IntegrationTests/Internal/Generated'
          test -z "$(git ls-files --others --exclude-standard 'tests/*/*.IntegrationTests/Internal/Generated')"

  # One runner per module: integration tests are CPU-bound, and each runner has its own Postgres.
  integration-test:
    needs: find-integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.find-integration-tests.outputs.projects) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'dotnet-tools.json', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build ${{ matrix.project }}

      - name: Integration tests
        run: dotnet test --project ${{ matrix.project }} --no-build --output Detailed

  # The repository is public, so the whole history is scanned: a secret removed in a later commit is still published.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No secrets in history
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --verbose /repo

  # Runs beside the tests: ReSharper reads the project model, so it needs only a restore.
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'dotnet-tools.json', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Flownodes.slnx

      - name: Layout standard is applied
        run: scripts/format.sh --check
