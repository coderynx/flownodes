name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      projects: ${{ steps.find.outputs.projects }}
      run_code_jobs: ${{ steps.changes.outputs.run_code_jobs }}
    steps:
      # HACK: a shallower clone lacks the merge commit's first parent, the base branch, which the changes step diffs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: find
        run: echo "projects=$(ls -d tests/*/*.IntegrationTests | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

      - id: changes
        run: |
          run_code_jobs=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            changed=$(git diff --no-renames --name-only HEAD^1 HEAD)
            printf '%s\n' "$changed" | grep -qv '\.md$' || run_code_jobs=false
          fi
          echo "run_code_jobs=$run_code_jobs" >> "$GITHUB_OUTPUT"

  # Unit and architecture tests need no database, so they run in seconds beside the integration jobs.
  build-and-unit-test:
    needs: plan
    if: needs.plan.outputs.run_code_jobs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'dotnet-tools.json', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build Flownodes.slnx -p:SkipWebClient=true

      - name: Unit and architecture tests
        run: |
          for project in tests/Architecture.Tests tests/*/*.UnitTests; do
            dotnet test --project "$project" --no-build --output Detailed
          done

      # Wolverine's handler code is generated and committed (apps/Flownodes/Internal/Generated/README.md). Writing it
      # again must change nothing; a diff means a handler or message changed without regenerating.
      - name: Generated handler code is current
        env:
          ConnectionStrings__registry: Host=localhost;Database=ci
          ConnectionStrings__identity: Host=localhost;Database=ci
          ConnectionStrings__engine: Host=localhost;Database=ci
          ConnectionStrings__web: Host=localhost;Database=ci
          Flownodes__InstallationKey: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          dotnet run --project apps/Flownodes --no-build -- codegen write
          git diff --exit-code -- apps/Flownodes/Internal/Generated
          test -z "$(git ls-files --others --exclude-standard apps/Flownodes/Internal/Generated)"

  # One runner per module: integration tests are CPU-bound, and each runner has its own Postgres.
  integration-test:
    needs: plan
    if: needs.plan.outputs.run_code_jobs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.plan.outputs.projects) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'dotnet-tools.json', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/web/Web.Client/package.json

      - name: Build
        run: dotnet build ${{ matrix.project }}

      - name: Integration tests
        run: dotnet test --project ${{ matrix.project }} --no-build --output Detailed

  web-client:
    needs: plan
    if: needs.plan.outputs.run_code_jobs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/web/Web.Client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/web/Web.Client/package.json
          cache: npm
          cache-dependency-path: packages/web/Web.Client/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  web-end-to-end:
    needs: plan
    if: needs.plan.outputs.run_code_jobs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests/web/Web.EndToEndTests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'dotnet-tools.json', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version-file: tests/web/Web.EndToEndTests/package.json
          cache: npm
          cache-dependency-path: tests/web/Web.EndToEndTests/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Playwright tests
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: tests/web/Web.EndToEndTests/test-results

  # The repository is public, so the whole history is scanned: a secret removed in a later commit is still published.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No secrets in history
        run: scripts/gitleaks.sh

  # Runs beside the tests: ReSharper reads the project model, so it needs only a restore.
  layout:
    needs: plan
    if: needs.plan.outputs.run_code_jobs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'dotnet-tools.json', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Flownodes.slnx

      - name: Layout standard is applied
        run: scripts/format.sh --check
